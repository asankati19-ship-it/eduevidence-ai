[server]
maxUploadSize = 20
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#116258"
backgroundColor = "#fcfbf7"
secondaryBackgroundColor = "#edf2ee"
textColor = "#182f31"
headingFont = "Manrope"
headingFontWeights = [800, 740, 680]
baseRadius = "0.7rem"
borderColor = "#cbd7d2"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/manrope.woff2"
weight = "200 800"
style = "normal"

[theme.sidebar]
backgroundColor = "#1e3046"
secondaryBackgroundColor = "#334862"
textColor = "#f1f3f6"
primaryColor = "#ffceab"
